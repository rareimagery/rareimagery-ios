name: RareImagery
options:
  bundleIdPrefix: com.rareimagery
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 7ZGZLG2SRQ
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# Explicit shared schemes so Xcode Cloud (and CI generally) has something to
# build — xcodegen writes defined schemes into xcshareddata/xcschemes (shared),
# whereas an undefined scheme is only created per-user on Xcode open.
# Two names, one app target: the Xcode Cloud workflow invokes
# `-scheme RareImageryStudio`; local dev + docs use `-scheme RareImagery`.
# Both build the RareImagery target and share the RareImageryTests test
# action. Keep both scheme names until the workflow is repointed.
schemes:
  RareImagery: &appScheme
    build:
      targets:
        RareImagery: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RareImageryTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  RareImageryStudio: *appScheme

packages:
  RareImageryAPI:
    path: Packages/RareImageryAPI
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

targets:
  RareImagery:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RareImagery
    dependencies:
      - package: RareImageryAPI
      - package: GoogleSignIn
        product: GoogleSignIn
    entitlements:
      path: RareImagery/RareImagery.entitlements
      properties:
        # Declared here so `xcodegen generate` regenerates the entitlement into
        # the file. Without `properties`, xcodegen writes an empty <dict/> and
        # STRIPS Sign in with Apple on every regen (incl. Xcode Cloud via
        # ci_post_clone.sh) — breaking Apple login and failing App Store 4.8.
        com.apple.developer.applesignin:
          - Default
    configFiles:
      Debug: Configuration/Debug.xcconfig
      Release: Configuration/Release.xcconfig
    info:
      path: RareImagery/Info.plist
      properties:
        CFBundleDisplayName: RareImagery
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1019"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        # Allows HTTP to localhost (Simulator) and LAN IPs (device) for Debug
        # builds against the local docker stack. No effect on public HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: "RareImagery uses the camera to capture photos of items you want to sell."
        NSMicrophoneUsageDescription: "RareImagery uses the microphone so you can talk through listing details with the in-app voice assistant."
        NSSpeechRecognitionUsageDescription: "RareImagery transcribes your spoken product details on-device so Grok can value your item. Your audio stays on your phone."
        NSPhotoLibraryUsageDescription: "RareImagery uses photos you pick from your library to create product listings."
        NSPhotoLibraryAddUsageDescription: "RareImagery saves processed product photos back to your library."
        CFBundleURLTypes:
          - CFBundleURLName: com.rareimagery.studio.oauth
            CFBundleURLSchemes:
              - rareimagery
          - CFBundleURLName: com.google.oauth
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
        APIBaseURL: $(API_BASE_URL)
        XClientID: $(X_CLIENT_ID)
        OAuthClientID: $(OAUTH_CLIENT_ID)
        GoogleIOSClientID: $(GOOGLE_IOS_CLIENT_ID)
        Environment: $(ENVIRONMENT)
        UIAppFonts:
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-Bold.ttf
          - HankenGrotesk-Regular.ttf
          - HankenGrotesk-Medium.ttf
          - HankenGrotesk-SemiBold.ttf
          - HankenGrotesk-Bold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rareimagery.studio
        PRODUCT_NAME: RareImagery
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        SWIFT_OBJC_BRIDGING_HEADER: ""
    preBuildScripts:
      # Regression guard (docs/REGRESSION-2026-07-13.md, open question #3):
      # a Release archive built without Release.local.xcconfig bakes
      # placeholder OAuth IDs into the binary and ships a broken sign-in
      # to TestFlight. Fail the build instead. Debug builds only warn —
      # placeholders are legitimate there (mock/localhost workflows).
      #
      # Also validates API_BASE_URL (2026-07-21 incident): in xcconfig, //
      # starts a comment, so "https://host" silently truncates to "https:"
      # and every request resolves against hostname "api". The correct
      # spelling is https:/$()/host. Reject any value without a real host.
      - name: Guard against placeholder auth config
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          bad=""
          case "${X_CLIENT_ID:-}" in ""|REPLACE_ME*) bad="X_CLIENT_ID" ;; esac
          case "${OAUTH_CLIENT_ID:-}" in ""|VERIFY*|REPLACE_ME*) bad="${bad:-OAUTH_CLIENT_ID}" ;; esac
          # Google is OPTIONAL: an unset/placeholder GOOGLE_IOS_CLIENT_ID just hides
          # the Google button in-app (SignInView.isGoogleClientConfigured) — it does
          # NOT fail the build, so Apple + X can ship without Google configured.
          google_off=""
          case "${GOOGLE_IOS_CLIENT_ID:-}" in ""|REPLACE_ME*) google_off=1 ;; esac
          # GOOGLE_REVERSED_CLIENT_ID is still validated: it is baked into
          # CFBundleURLSchemes and App Store rejects a malformed scheme, so an
          # underscore/placeholder must fail even when Google sign-in is off. The
          # RFC-safe default in Release.xcconfig passes this check.
          case "${GOOGLE_REVERSED_CLIENT_ID:-}" in
            ""|*REPLACE*|*replace*|*_*) bad="${bad:-GOOGLE_REVERSED_CLIENT_ID}" ;;
            com.googleusercontent.apps.[a-zA-Z0-9.+-]*) ;;
            *) bad="${bad:-GOOGLE_REVERSED_CLIENT_ID}" ;;
          esac
          base="${API_BASE_URL:-}"
          base_msg=""
          case "$base" in
            "")
              base_msg="API_BASE_URL is unset." ;;
            http:|https:|http:/|https:/|http://|https://)
              base_msg="API_BASE_URL is '${base}' — no host. In xcconfig, // starts a comment, so 'https://host' truncates to '${base%%/*}'. Write it as https:/\$()/host instead." ;;
            http://*|https://*)
              host="${base#*://}"; host="${host%%/*}"; host="${host%%:*}"
              case "$host" in
                *.*|localhost) ;;
                *) base_msg="API_BASE_URL '${base}' has host '${host}' with no dot — looks truncated or malformed." ;;
              esac ;;
            *)
              base_msg="API_BASE_URL '${base}' is not an http(s):// URL. In xcconfig, write it as https:/\$()/host so // is not eaten as a comment." ;;
          esac
          if [ "${CONFIGURATION}" = "Release" ]; then
            if [ -n "$bad" ]; then
              echo "error: ${bad} is unset/placeholder in a Release build. Create Configuration/Release.local.xcconfig with real values (see Debug.local.xcconfig.example) before archiving."
              exit 1
            fi
            if [ -n "$base_msg" ]; then
              echo "error: ${base_msg} A Release build with a hostless APIBaseURL breaks every API call (2026-07-21 regression)."
              exit 1
            fi
          fi
          if [ -n "$bad" ]; then
            echo "warning: ${bad} is a placeholder — sign-in will be disabled in this build."
          fi
          if [ -n "$google_off" ]; then
            echo "warning: GOOGLE_IOS_CLIENT_ID is unset/placeholder — Google sign-in is hidden in this build (Apple + X still work). Set it to enable Google."
          fi
          google_scheme="${GOOGLE_REVERSED_CLIENT_ID:-}"
          case "$google_scheme" in
            *REPLACE*|*replace*|*_*) 
              echo "warning: GOOGLE_REVERSED_CLIENT_ID '${google_scheme}' is invalid for CFBundleURLSchemes (RFC1738: no underscores). Set a real reversed client ID from Google Cloud."
              ;;
          esac
          if [ -n "$base_msg" ]; then
            echo "warning: ${base_msg}"
          fi

  RareImageryTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RareImageryTests
    dependencies:
      - target: RareImagery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rareimagery.studio.tests
        GENERATE_INFOPLIST_FILE: YES
