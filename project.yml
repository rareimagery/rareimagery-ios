name: RareImagery
options:
  bundleIdPrefix: com.rareimagery
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 7ZGZLG2SRQ
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# Explicit shared schemes so Xcode Cloud (and CI generally) has something to
# build — xcodegen writes defined schemes into xcshareddata/xcschemes (shared),
# whereas an undefined scheme is only created per-user on Xcode open.
# Two names, one app target: the Xcode Cloud workflow invokes
# `-scheme RareImageryStudio`; local dev + docs use `-scheme RareImagery`.
# Both build the RareImagery target and share the RareImageryTests test
# action. Keep both scheme names until the workflow is repointed.
schemes:
  RareImagery: &appScheme
    build:
      targets:
        RareImagery: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RareImageryTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  RareImageryStudio: *appScheme

packages:
  RareImageryAPI:
    path: Packages/RareImageryAPI

targets:
  RareImagery:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RareImagery
    dependencies:
      - package: RareImageryAPI
    configFiles:
      Debug: Configuration/Debug.xcconfig
      Release: Configuration/Release.xcconfig
    info:
      path: RareImagery/Info.plist
      properties:
        CFBundleDisplayName: RareImagery
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1000"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        # Allows HTTP to localhost (Simulator) and LAN IPs (device) for Debug
        # builds against the local docker stack. No effect on public HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: "RareImagery uses the camera to capture photos of items you want to sell."
        NSMicrophoneUsageDescription: "RareImagery records voice notes you add to product listings."
        NSSpeechRecognitionUsageDescription: "RareImagery transcribes your spoken product details on-device so Grok can value your item. Your audio stays on your phone."
        NSPhotoLibraryUsageDescription: "RareImagery uses photos you pick from your library to create product listings."
        NSPhotoLibraryAddUsageDescription: "RareImagery saves processed product photos back to your library."
        CFBundleURLTypes:
          - CFBundleURLName: com.rareimagery.studio.oauth
            CFBundleURLSchemes:
              - rareimagery
        APIBaseURL: $(API_BASE_URL)
        XClientID: $(X_CLIENT_ID)
        Environment: $(ENVIRONMENT)
        UIAppFonts:
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-Bold.ttf
          - HankenGrotesk-Regular.ttf
          - HankenGrotesk-Medium.ttf
          - HankenGrotesk-SemiBold.ttf
          - HankenGrotesk-Bold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rareimagery.studio
        PRODUCT_NAME: RareImagery
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        SWIFT_OBJC_BRIDGING_HEADER: ""

  RareImageryTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RareImageryTests
    dependencies:
      - target: RareImagery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rareimagery.studio.tests
        GENERATE_INFOPLIST_FILE: YES
